name: CI/CD - Deploy Cloud Run Job & GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Build & Deploy Python Selenium Scraper to Google Cloud Run Jobs
  deploy-cloud-run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Container & Deploy Cloud Run Job
        working-directory: ./scraper
        run: |
          gcloud run jobs deploy rrss-daily-scraper \
            --source . \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --service-account campaign-pipeline-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},SHEET_ID=${{ secrets.SHEET_ID }}" \
            --max-retries 2 \
            --task-timeout 30m \
            --memory 2Gi \
            --cpu 2 \
            --quiet

  # JOB 2: Publish Interactive Dashboard to GitHub Pages
  deploy-github-pages:
    runs-on: ubuntu-latest
    needs: deploy-cloud-run-scraper
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Dashboard Artifact (docs/ folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
